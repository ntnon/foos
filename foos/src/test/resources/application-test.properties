# Test profile - uses H2 in-memory database instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:foostest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# Security - disable for tests
spring.security.user.name=test
spring.security.user.password=test
