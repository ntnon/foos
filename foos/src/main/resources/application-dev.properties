# Dev profile ? uses H2 in-memory database instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:foosdev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 console ? accessible at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# Use 8081 to avoid conflict with Docker backend running on 8080
server.port=8081

